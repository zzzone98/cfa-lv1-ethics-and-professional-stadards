<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>s; // content is authored, contains intentional <b>
const bi=(en,ko)=>`<div class="pair"><p class="en">${en}</p>${ko?`<p class="ko">${ko}</p>`:''}</div>`;
const li=arr=>`<ul class="bl">${arr.map(x=>Array.isArray(x)?`<li><span class="en">${x[0]}</span>${x[1]?`<span class="ko">${x[1]}</span>`:''}${x[2]?`<ul>${x[2].map(y=>`<li><span class="en">${y[0]}</span>${y[1]?`<span class="ko">${y[1]}</span>`:''}</li>`).join('')}</ul>`:''}</li>`:`<li>${x}</li>`).join('')}</ul>`;
const plain=(t,lab='쉽게 말하면')=>`<div class="plain"><span class="lab">${lab}</span>${t}</div>`;
const trap=(arr,lab='Exam trap · 시험 함정')=>`<div class="trap"><span class="lab">${lab}</span><ul>${arr.map(x=>`<li><span class="en">${x[0]}</span>${x[1]?`<br><span class="ko">${x[1]}</span>`:''}</li>`).join('')}</ul></div>`;
const table=(heads,rows)=>`<div class="tw"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${Array.isArray(c)?`<span class="en">${c[0]}</span>${c[1]?`<span class="ko">${c[1]}</span>`:''}`:c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const quote=(en,ko)=>`<div class="quote"><p class="en" style="margin:0">${en}</p>${ko?`<p class="ko" style="margin:4px 0 0">${ko}</p>`:''}</div>`;
const G={I:'--g1',II:'--g2',III:'--g3',IV:'--g4',V:'--g5',VI:'--g6',VII:'--g7'};
const cvar=g=>`var(${G[g]})`;

/* ---------- TAB DEFINITIONS ---------- */
const TABS=[
 ['overview','Overview','시작하기'],
 ['r89','R89','Ethics & Trust'],
 ['r90','R90','Code & Standards'],
 ['r91','R91','Standards I–VII'],
 ['r92','R92','GIPS'],
 ['r93','R93','Ethics Application'],
 ['sheet','Cheat Sheet','비교·암기'],
 ['quiz','Practice','예상문제'],
];

/* ---------- OVERVIEW ---------- */
const OVERVIEW=`<div class="col">
<h2 class="rt">Ethical and Professional Standards</h2>
<p class="rsub">윤리 및 직업기준 · Level I 비중 약 15–20% (Standards of Practice Handbook + GIPS)</p>
${plain(`이 과목은 <b>“투자 전문가가 어떻게 행동해야 하는가”</b>에 대한 규칙집입니다. 계산 문제는 없고, 짧은 사례(누가 무엇을 했다)를 주고 <b>“위반인가? 어느 Standard 위반인가? 가장 적절한 행동은?”</b>을 묻습니다. 그래서 규칙의 <b>영어 표현</b>과 <b>판단 기준</b>을 정확히 아는 것이 핵심입니다.`)}
<h3>Reading 구성 · 무엇을 배우나</h3>
${table(['Reading','Title','한 줄 요약'],[
 ['R89','Ethics and Trust in the Investment Profession','윤리란 무엇이고, 투자업에서 왜 특히 중요한가'],
 ['R90','Code of Ethics and Standards of Professional Conduct','CFA 윤리강령 6개 + 직업행위기준 7개 Standard(23개 세부항목), 징계 절차(PCP)'],
 ['R91','Guidance for Standards I–VII','각 Standard의 해석, 위반 사례, 권고사항 — <b>시험의 대부분</b>'],
 ['R92','Introduction to GIPS','성과보고 국제기준: 왜 만들었나, 누가 준수하나, 컴포지트, 검증'],
 ['R93','Ethics Application','실제 사례에 Standards 적용하기'],
])}
<h3>7 Standards 한눈에 · “누구를 보호하는 규칙인가?”</h3>
<p class="ko" style="margin-bottom:6px">카드를 누르면 R91 해당 Standard로 이동합니다.</p>
<div class="map">${[
 ['I','Professionalism','전문가 정신','나 자신 — 기본이 된 전문가'],
 ['II','Integrity of Capital Markets','자본시장 무결성','시장 — 시장을 더럽히지 않기'],
 ['III','Duties to Clients','고객에 대한 의무','고객 — 고객이 1순위'],
 ['IV','Duties to Employers','고용주에 대한 의무','회사 — 회사에 해 끼치지 않기'],
 ['V','Investment Analysis, Recommendations, and Actions','투자분석·추천·행위','업무의 질 — 분석·소통·기록'],
 ['VI','Conflicts of Interest','이해상충','이해상충 — 숨기지 말고 공시'],
 ['VII','Responsibilities as a CFA Institute Member or CFA Candidate','CFA 회원·응시자 책임','CFA 브랜드 — 시험·명칭 보호'],
].map(m=>`<button class="mapc" style="--c:${cvar(m[0])}" data-jump="${m[0]}"><span class="num">Standard ${m[0]}</span><span class="nm">${m[1]}</span><span class="who">${m[2]} · ${m[3]}</span></button>`).join('')}</div>

<h3>Professor's Note · 문제는 이렇게 나온다</h3>
${li([
 ['Know <b>what constitutes a violation</b>. You need not memorize the Standard number and letter, but know whether an action violates, for example, Professionalism rather than Duties to Employers or Duties to Clients.','번호·알파벳 암기는 필요 없지만, 어느 카테고리 위반인지는 구분해야 합니다.'],
 ['Many Standards use terms open to interpretation — <b>“reasonable,” “adequate,” “token.”</b> Exam questions will make it clear whether conduct rose to the level of “reasonable.”','해석이 갈리는 용어가 많지만, 시험 문제는 충족/미충족이 분명하게 나옵니다.'],
 ['No monetary value for a <b>token gift</b> is given. A business dinner is likely token; a week at a condominium in Aspen or Super Bowl tickets are likely not. Look for clues such as <b>“lavish”</b> and <b>“luxury.”</b>','token 선물 금액 기준은 없습니다. 문제 속 “호화로운” 같은 힌트 단어를 찾으세요.'],
 ['A question may offer a <b>“reason”</b> that might make one believe a Standard does not apply. In most cases the reason does not change the requirement. <b>If the Standard says it is a violation, it is a violation.</b>','그럴듯한 이유를 붙여도 금지 행위면 위반입니다.'],
 ['Exception: when <b>intent</b> is key to the Standard — e.g., <b>intending to mislead</b> clients or market participants (II(B)), <b>knowingly</b> misrepresenting (I(C)).','예외: 의도·인지가 요건인 Standard는 의도를 따져야 합니다.'],
 ['Some actions may violate <b>more than one Standard</b>.','한 행위가 여러 Standard를 동시에 위반할 수 있습니다.'],
])}
<h3>문제 풀이 3단계</h3>
<div class="flow">
 <div class="step"><span class="n">STEP 1</span><b>Who is harmed?</b><span class="ko">누가 피해를 보나 → 시장 II / 고객 III / 회사 IV / CFA VII</span></div>
 <div class="step"><span class="n">STEP 2</span><b>Ignore the excuse</b><span class="ko">핑계는 무시. 단, II(B) 의도·I(C) 인지는 확인</span></div>
 <div class="step"><span class="n">STEP 3</span><b>Most appropriate action?</b><span class="ko">정답 후보: disclose / written consent / dissociate / decline in writing</span></div>
</div>
</div>`;

/* ---------- R89 ---------- */
const R89=`<div class="col">
<h2 class="rt">R89 · Ethics and Trust in the Investment Profession</h2>
<p class="rsub">윤리의 개념과 투자업에서 신뢰가 중요한 이유 · LOS 89.a–h</p>

<h3><span class="los">89.a</span>Explain ethics · 윤리란</h3>

 recM:[['Keep informed of changes in laws; review written compliance procedures regularly; maintain copies of current laws','법규 변경 파악, 절차 검토, 법규 사본 유지'],['When in doubt about legality, consult your <b>supervisor, compliance personnel, or a lawyer</b>','애매하면 상사·컴플라이언스·변호사와 상의'],['When dissociating, <b>keep records documenting the violations</b>; encourage employer to bring an end to them','분리할 때 기록을 남길 것']],
 recF:[['Have a code of ethics','윤리강령 보유'],['Provide employees with information on laws, rules, and regulations','법규 정보 제공'],['Have procedures for reporting suspected violations','위반 신고 절차']],
 trap:[['Must the member report the colleague to CFA Institute and regulators? → <b>No requirement</b> under the Standards; required action is to <b>dissociate</b> and urge the firm to stop it.','CFA·당국 신고는 의무 아님. 분리하고 회사에 중단 촉구가 의무.'],['Refusing to sign but asking your supervisor to sign in your place still assists the violation.','본인 대신 남에게 서명하게 하는 것도 위반 조력.']]},

{g:'I',code:'I(B)',name:'Independence and Objectivity',ko:'독립성과 객관성',
 text:'Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional activities. Members and Candidates must not <b>offer, solicit, or accept</b> any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another\'s independence and objectivity.',
 textko:'독립성·객관성을 유지해야 하며, 자신이나 남의 판단을 흐릴 만한 선물·혜택을 주거나, 요구하거나, 받으면 안 된다.',
 plain:'<b>판단을 돈으로 사거나 팔지 마라.</b> 커버하는 회사가 하와이 여행을 보내주면 위반, 업무상 평범한 저녁식사는 OK. 주는 것(offer)도 받는 것(accept)도 요구하는 것(solicit)도 모두 해당됩니다.',
 pts:[
  ['Pressure or inducements to give a specific rating, select certain managers or vendors, or produce favorable or unfavorable research → letting them influence you is a violation.','특정 등급·벤더 선정 압력에 굴복하면 위반.'],
  ['<b>Allocating shares in oversubscribed IPOs to personal accounts</b> is a violation.','인기 IPO를 내 계좌에 넣으면 위반.'],
  ['<b>Normal business entertainment is permitted.</b>','통상적인 접대는 허용.'],
  ['<b>Gifts from clients</b> are considered less likely to compromise independence than gifts from other parties. Client gifts must be <b>disclosed to the member\'s employer prior to acceptance, if possible, but after acceptance, if not</b>.','고객 선물은 받아도 되지만 고용주에 공시(가능하면 사전, 아니면 사후).'],
  ['<b>Issuer-paid research</b> is permitted if compensation is a <b>flat rate not tied to the conclusions</b> of the report <b>and</b> the fact that it is issuer-paid is <b>disclosed</b>. Compensation dependent on conclusions or market impact, or failure to disclose → violation.','발행사가 돈 낸 리서치: 정액 + 공시면 OK.'],
 ],
 recM:[['Pay for your own <b>travel</b> to company events or tours when practicable; limit use of <b>corporate aircraft</b> to trips for which commercial travel is not an alternative','가능하면 여행 경비는 직접 부담, 기업 전용기는 상업 항공편이 없을 때만']],
 recF:[['Restrict employee participation in <b>IPOs and private placements</b>; require <b>pre-approval</b>','IPO·사모 참여 제한, 사전승인'],['Appoint a compliance officer; written policies on independence; clear procedures for reporting violations','컴플라이언스 오피서·서면 정책'],['<b>Limit gifts, other than from clients, to token items only</b>','고객 외 선물은 token만']],
 trap:[['Remote site, commercial travel effectively unavailable → accepting the company\'s charter flight is <b>not a violation</b>.','상업 항공편이 없으면 회사 전세기 이용 OK.'],['Gift from a client for <b>past</b> performance → I(B), <b>disclose</b>. Bonus for <b>future</b> performance → IV(B), <b>written consent</b>.','과거 성과 선물=I(B) 공시 / 미래 성과 보너스=IV(B) 서면동의.'],['Do not treat <b>credit ratings</b> as automatically objective.','신용등급도 무조건 믿으면 안 됨.']]},

{g:'I',code:'I(C)',name:'Misrepresentation',ko:'허위표시',
 text:'Members and Candidates must not <b>knowingly</b> make any misrepresentations relating to investment analysis, recommendations, actions, or other professional activities.',
 textko:'투자분석·추천·직업활동에 대해 알면서 거짓을 말하거나 오해하게 만들면 안 된다.',
 plain:'거짓말 금지 + <b>말해야 할 걸 빼먹는 것(omission)도 거짓말</b> + <b>남의 것을 내 것처럼(plagiarism)</b>도 금지. 단, 정부·공인 통계기관의 단순 데이터는 출처 표시 안 해도 됩니다.',
 pts:[
  ['Includes knowingly misleading investors, <b>omitting relevant information</b>, presenting <b>selective data</b> to mislead, and <b>plagiarism</b>.','오도, 누락, 선택적 데이터, 표절.'],
  ['<b>Plagiarism</b> = using reports, forecasts, models, ideas, charts, graphs, or spreadsheets created by others <b>without crediting the source</b>.','출처 없이 남의 자료 사용.'],
  ['Crediting the source is <b>not required</b> for projections, statistics, and tables from <b>recognized financial and statistical reporting services</b>.','공인 통계 서비스 자료는 출처 불필요.'],
  ['Models/research by other members of <b>the same firm</b>: you may omit names of those <b>no longer with the firm</b>, as long as you do not represent the work as yours alone.','퇴사한 같은 회사 동료 이름은 생략 가능.'],
 ],
 viol:[['Presenting third-party research as your own','남의 리서치를 내 것처럼'],['<b>Guaranteeing a specific return</b> on securities with no explicit guarantee from a government body or financial institution','보증 없는 증권의 수익 보장'],['Selecting a valuation service because it gives the <b>highest value</b> to untraded holdings','가장 높은 평가 서비스 선택'],['Selecting a <b>benchmark not comparable</b> to the strategy','비교 불가능한 벤치마크'],['Performance data that <b>omits accounts or relevant variables</b>','계좌·변수 누락'],['False information about the firm\'s <b>capabilities, expertise, or experience</b>','역량 허위'],['Using <b>misleading third-party marketing materials</b>','오도하는 외부 마케팅 자료']],
 okk:[['Stating that a U.S. bank CD is guaranteed up to FDIC limits (an actual guarantee exists)','실제 보증이 있는 상품을 보증된다고 말하는 것'],['Using a Treasury yield table without citation','재무부 통계 표 무인용 사용']],
 recM:[['Prepare a summary of your experience, qualifications, and services','경력·자격 요약서'],['Cite the source of summaries of others\' materials; <b>keep copies</b> of materials used in preparing research','출처 인용, 사용 자료 사본 보관'],['Encourage employers to verify third-party marketing materials; periodically review communications for misrepresentation','외부 자료 검증, 정기 검토']],
 trap:[['Key person leaves during a pending proposal → must <b>inform the prospect</b> (misrepresentation by omission).','제안 심사 중 핵심 인력 퇴사 → 즉시 알려야 함.'],['Turning management\'s <b>optimism</b> into <b>certainty</b> in a report is misrepresentation.','경영진의 낙관을 확정적 사실처럼 쓰면 위반.']]},

{g:'I',code:'I(D)',name:'Misconduct',ko:'부정행위',
 text:'Members and Candidates must not engage in any professional conduct involving <b>dishonesty, fraud, or deceit</b> or commit any act that reflects adversely on their professional <b>reputation, integrity, or competence</b>.',
 textko:'부정직·사기·기만이 있는 직업적 행위를 하거나, 직업적 평판·무결성·역량에 나쁘게 반영되는 행위를 하면 안 된다.',
 plain:'업무 중 사기·기만은 당연히 금지. 사생활이라도 <b>“이 사람 못 믿겠다”</b>는 인상을 주는 행위(절도, 경비 부풀리기)는 위반. 하지만 평화 시위로 체포된 것처럼 <b>정직성과 무관</b>하면 반드시 위반은 아닙니다.',
 pts:[
  ['The second part applies to <b>all conduct</b> (including personal), but only if it <b>reflects adversely on professional reputation, integrity, or competence</b>.','사생활도 포함, 단 직업적 신뢰를 깎을 때만.'],
  ['Must not use this Standard to settle <b>personal, political, or other disputes</b> unrelated to professional ethics.','개인적·정치적 싸움에 이용 금지.'],
  ['<b>Neglecting to perform due diligence</b> when required is misconduct.','해야 할 실사를 안 하면 부정행위.'],
  ['Acts outside professional capacity that reflect poorly on honesty (<b>theft, fraud</b>) → violation. Illegal acts that do not (e.g., <b>civil disobedience</b>) → not necessarily.','절도·사기 위반 / 시민 불복종은 반드시 위반 아님.'],
 ],
 recF:[['Develop and adopt a code of ethics; make clear unethical behavior will not be tolerated','윤리강령, 무관용'],['Give employees a list of potential violations and sanctions, including dismissal','위반·제재 목록'],['<b>Check references</b> of potential employees','채용 시 평판 조회']],
 trap:[['Padding an expense report — even if later disclosed and repaid — is <b>misconduct</b> (dishonesty).','경비 부풀리기는 나중에 반납해도 부정행위.'],['“Any illegal act is misconduct” → <b>false</b>.','“모든 불법행위 = 부정행위”는 오답.']]},

{g:'I',code:'I(E)',name:'Competence',ko:'역량',
 text:'Members and Candidates must act with and maintain the competence necessary to fulfill their professional responsibilities.',
 textko:'직업적 책임을 다하는 데 필요한 역량을 갖추고 유지해야 한다.',
 plain:'맡은 일을 할 실력을 갖춰라. 새 업무를 맡으면 <b>스스로 공부해서</b> 역량을 갖춰야 합니다. 계속교육은 <b>권장(recommend)</b>이지 의무가 아닙니다.',
 pts:[
  ['Competence = having and maintaining the abilities, skills, and knowledge needed for one\'s professional responsibilities.','필요한 능력·지식 보유와 유지.'],
  ['<b>Negative outcomes do not necessarily imply a lack of competence.</b>','결과가 나쁘다고 역량 부족은 아님.'],
  ['When accepting a new or unfamiliar role, it is the member\'s responsibility to <b>develop the required abilities</b>.','새 역할엔 스스로 역량 개발.'],
  ['The Standard <b>recommends, but does not require</b>, continuing education.','계속교육은 권장.'],
 ],
 recM:[['Continuing education, professional designations, seminars, professional organizations, informal self-study','계속교육, 자격, 세미나, 단체, 자율학습']],
 trap:[['Accepting a supervisory role without taking steps to gain competence as a supervisor → violation (R93).','감독 역할을 맡고 준비를 안 함 → 위반.']]},

{g:'II',code:'II(A)',name:'Material Nonpublic Information',ko:'중요 미공개정보 (MNPI)',
 text:'Members and Candidates who possess material nonpublic information that could affect the value of an investment must not <b>act or cause others to act</b> on the information.',
 textko:'투자 가치에 영향을 줄 수 있는 중요 미공개정보를 가지고 있으면, 그 정보로 거래하거나 남이 거래하게 해서는 안 된다.',
 plain:'<b>“아직 아무도 모르는데 주가를 움직일 정보”</b>로는 거래 금지. 친구에게 알려줘서 거래하게 하는 것도 금지. 단, 공개정보와 사소한 정보를 모아 스스로 결론을 내는 <b>모자이크 이론(mosaic theory)</b>은 애널리스트의 정상 업무라 OK.',
 pts:[
  ['<b>Material</b>: disclosure would <b>affect the price</b> of a security, or a <b>reasonable investor would want</b> the information before making an investment decision. <b>Ambiguous</b> information may not be material.','중요성: 주가에 영향 or 합리적 투자자가 알고 싶어 할 정보. 모호하면 중요하지 않을 수 있음.'],
  ['<b>Nonpublic</b>: until it has been <b>made available to the marketplace</b>. An <b>analyst conference call is not public disclosure</b>. <b>Selective disclosure</b> creates the potential for insider-trading violations.','미공개: 시장 전체에 공개 전. 애널리스트 콜·일부에게만 공개 = 미공개.'],
  ['Extends to <b>mutual funds</b> containing the securities and related <b>swaps and options</b>. The member is responsible for determining whether information has been publicly disseminated.','관련 펀드·파생상품도 포함.'],
  ['MNPI received in investment banking transactions may be used only for its <b>intended purpose</b> until public.','IB 업무로 받은 정보는 원래 목적으로만.'],
  ['<b>Mosaic theory</b>: reaching a conclusion through perceptive analysis of <b>public information + non-material nonpublic information</b> is <b>not a violation</b>.','공개정보 + 비중요 미공개정보 = OK.'],
 ],
 recM:[['Make reasonable efforts to achieve <b>public dissemination</b> of the information','공개되도록 노력'],['Encourage firms to adopt procedures to prevent misuse of MNPI','오용 방지 절차 권장']],
 recF:[['Use a <b>firewall</b>: control interdepartmental communications through a <b>clearance area</b> (compliance or legal); <b>review employee trades</b>; maintain <b>“watch,” “restricted,” and “rumor” lists</b>','정보차단벽: clearance area, 직원거래 검토, watch/restricted/rumor 리스트'],['Monitor and restrict <b>proprietary trading</b> while holding MNPI; prohibiting all proprietary trading may <b>send a signal</b> → only take the <b>opposite side of unsolicited customer trades</b>','자기매매 제한. 전면 금지는 시장에 신호를 주므로 비요청 고객주문의 반대편만']],
 trap:[['Information shared in an <b>internet chat room</b> or overheard in an airport lounge is still nonpublic → may not trade <b>in any jurisdiction</b>.','채팅방·엿들은 정보도 미공개. 어떤 나라에서도 거래 불가.'],['Sharing a pre-release press release with an outside person (even for grammar checks) risks violating II(A).','공시 전 보도자료를 외부인(친척)에게 보내는 것도 위험.'],['Selective disclosure is <b>not</b> a way to prevent MNPI trading; firewalls and personal trading limits are.','선택적 공시는 방지책이 아니라 원인.']]},

{g:'II',code:'II(B)',name:'Market Manipulation',ko:'시장조작',
 text:'Members and Candidates must not engage in practices that distort prices or artificially inflate trading volume with the <b>intent to mislead</b> market participants.',
 textko:'시장참가자를 오도할 의도로 가격을 왜곡하거나 거래량을 인위적으로 부풀리면 안 된다.',
 plain:'핵심 단어는 <b>“의도(intent to mislead)”</b>. 대량 매매로 가격이 움직인 것만으로는 위반이 아닙니다. 하지만 <b>헛소문 퍼뜨리기</b>, <b>짜고 치는 매매로 거래량 부풀리기</b>는 위반.',
 pts:[
  ['Member actions may affect prices and volume without violating the Standard — the key is <b>intent to mislead</b>.','결과가 아니라 의도가 기준.'],
  ['<b>Information-based</b>: spreading false information to affect prices or volume.','허위정보 유포.'],
  ['<b>Transaction-based</b>: trades intended to mislead market participants (e.g., two affiliates simultaneously buying and selling to inflate volume).','오도 목적 거래.'],
 ],
 viol:[['Posting untrue negative claims online about a company you are short','공매도 후 악성 허위글'],['Listing fake shareholders to meet exchange listing requirements','상장 요건용 가짜 주주'],['Affiliates trading with each other to show “liquidity” in marketing','자회사끼리 매매로 유동성 과장']],
 okk:[['Buying stock while shorting puts as an <b>arbitrage strategy</b> known to fund investors','투자자가 아는 차익거래 전략'],['A large legitimate trade that moves the price','정당한 대량거래로 가격 변동']],
 trap:[['A post that hypes a stock you want to sell → violates II(B) <b>and</b> VI (conflict not disclosed).','팔고 싶은 주식을 띄우는 글 → II(B) + VI 동시 위반.']]},

{g:'III',code:'III(A)',name:'Loyalty, Prudence, and Care',ko:'충실·신중·주의',
 text:'Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and Candidates must act for the benefit of their clients and place their clients\' interests <b>before their employer\'s or their own interests</b>.',
 textko:'고객에게 충실해야 하며 합리적 주의와 신중한 판단을 해야 한다. 고객 이익을 회사·자신의 이익보다 앞에 둔다.',
 plain:'우선순위는 <b>고객 → 회사 → 나</b>. 고객 돈(soft dollars 포함)은 고객을 위해서만 쓰고, 연기금이라면 돈을 맡긴 회사가 아니라 <b>연금 받을 사람(beneficiaries)</b>에게 충실해야 합니다.',
 pts:[
  ['<b>Client interests always come first.</b> The Standard does <b>not impose a fiduciary duty</b> where one did not already exist, but requires acting in clients\' best interests.','고객 우선. 없던 수탁의무를 새로 만들진 않음.'],
  ['Exercise the prudence, care, skill, and diligence that a person acting <b>in a like capacity</b> and familiar with such matters would use.','같은 일을 하는 전문가 수준의 신중함.'],
  ['Manage pools of client assets per the <b>governing documents</b> (trust documents, IMAs); decisions in the context of the <b>total portfolio</b>.','신탁증서 등에 따라, 전체 포트폴리오 관점.'],
  ['Inform clients of any <b>limitations</b> in the advisory relationship.','자문 관계의 제한 고지(예: 자사 상품만 추천 가능).'],
  ['<b>Vote proxies</b> in an informed and responsible manner; due to cost-benefit, it <b>may not be necessary to vote all proxies</b>.','의결권은 책임 있게. 비용 대비 효과 없으면 생략 가능.'],
  ['Client brokerage — <b>“soft dollars” / “soft commissions”</b> — is the client\'s asset and must be used to <b>benefit the client</b>.','소프트달러 = 고객 자산 → 고객을 위해서만.'],
  ['The “client” may be the <b>investing public as a whole</b>. For a pension fund, loyalty is owed to the <b>beneficiaries</b>.','고객 = 투자대중일 수도. 연기금은 수익자.'],
 ],
 viol:[['Using soft dollars to pay the firm\'s <b>operating expenses</b> (rent, salaries)','소프트달러로 회사 운영비 지급'],['Investing more aggressively because the <b>plan sponsor</b> asks, against beneficiaries\' interest','스폰서 요청으로 수익자에 불리한 공격적 투자'],['Accepting <b>personal</b> benefits (discounted personal brokerage, special account privileges) from a broker used for client trades','고객 거래 브로커로부터 개인 혜택 수령'],['Client agreements excusing reps from acting in clients\' best interests — <b>no “opt out”</b>','계약서로 의무 면제 시도']],
 okk:[['Soft dollars used for <b>research</b> that benefits clients','고객에게 도움되는 리서치'],['Not voting a proxy when costs exceed benefits (policy disclosed)','비용>효과면 의결권 미행사'],['Allowing the broker to cover a trading error <b>the broker made</b>, at no cost to the client','브로커 실수를 브로커가 부담']],
 recM:[['Submit to clients, <b>at least quarterly</b>, itemized statements of all securities in custody and all debits, credits, and transactions','최소 분기 1회 명세서'],['Firm policies should cover: follow laws, establish objectives, consider suitability, <b>diversify</b>, deal fairly, <b>disclose conflicts</b>, <b>disclose compensation arrangements</b>, vote proxies in clients\' best interest, maintain confidentiality, <b>seek best execution</b>','분산, 상충·보상 공시, 최선 집행 등']],
 trap:[['Offering a client “preferential access to a hot new issue” to make up for an error → violates <b>III(B) Fair Dealing</b> (other clients disadvantaged).','실수 보상으로 인기 공모주 우선 배정 → 공정대우 위반.']]},

{g:'III',code:'III(B)',name:'Fair Dealing',ko:'공정대우',
 text:'Members and Candidates must deal <b>fairly and objectively</b> with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities.',
 textko:'투자분석·추천·투자행위에서 모든 고객을 공정하고 객관적으로 대해야 한다.',
 plain:'모든 고객에게 <b>공평한 기회</b>를 줘라. 단 <b>“공정(fairly)” ≠ “똑같이(equally)”</b>. 돈 더 내는 VIP 서비스는 OK지만, 공시하고 원하는 누구나 이용 가능해야 하며 다른 고객에게 피해가 없어야 합니다. 추천을 바꾸면 <b>동시에</b> 알려야 합니다.',
 pts:[
  ['Do not discriminate against any clients when disseminating recommendations or taking action. <b>“Fairly” does not mean “equally.”</b>','차별 금지. 공정 ≠ 동일.'],
  ['<b>Different service levels are acceptable</b> but must not disadvantage any client; <b>disclose</b> them to all clients and prospects, and make premium service <b>available to all willing to pay</b>.','서비스 차등 허용 조건 3가지.'],
  ['Give all clients a <b>fair opportunity to act</b> on every recommendation. Clients unaware of a change should be advised <b>before an order is accepted</b>.','추천 변경을 모르는 고객 주문은 접수 전에 알려줌.'],
  ['Treat individual and institutional clients fairly; don\'t take advantage of your position (e.g., <b>taking shares of an oversubscribed IPO</b>).','초과청약 IPO를 본인이 가져가지 않기.'],
  ['<b>Family member accounts that are client accounts</b> are treated like any other client account — no advantage, no disadvantage.','가족 고객계좌 = 일반 고객과 동일.'],
 ],
 recM:[['Encourage compliance procedures for proper dissemination; <b>maintain a list of clients and their holdings</b>','고객·보유종목 목록']],
 recF:[['<b>Limit the number of people</b> aware of a change in recommendation','아는 사람 최소화'],['<b>Shorten the time frame</b> between decision and dissemination','결정→전파 시간 단축'],['<b>Pre-dissemination guidelines</b>: those with prior knowledge may not discuss or act on it','사전 전파 금지 지침'],['Disseminate <b>simultaneously</b> to all clients who have expressed an interest or for whom the investment is suitable','관심·적합 고객에게 동시 전파'],['<b>Written trade allocation procedures</b> (fairness, timely execution, accuracy) and <b>disclose</b> them','서면 배분 절차 + 공시'],['<b>Systematic account review</b>; disclose available levels of service','체계적 계좌 검토']],
 trap:[['Allocating an oversubscribed issue <b>pro rata including family-member client accounts</b> → OK. Excluding them or putting them last → not fair.','가족 고객계좌도 포함해 비례 배분 = 정답.'],['Firm trades for its own account <b>immediately after announcing</b> a change → violation.','발표 직후 자기매매 → 위반.'],['Block trade price allocation: <b>same execution price</b> or pro rata is fair; first-in-first-out after seeing gains is not.','블록 체결가: 평균가·비례 배분 OK.'],['Dissemination priority by <b>known interest</b> in the security is acceptable; by client size is not.','전파 대상은 관심 여부 기준(규모 기준 X).']]},

{g:'III',code:'III(C)',name:'Suitability',ko:'적합성',
 text:'1. When Members and Candidates are in an <b>advisory relationship</b> with a client, they must: (a) Make a reasonable inquiry into a client\'s or prospective client\'s investment experience, risk and return objectives, and financial constraints <b>prior to</b> making any investment recommendation or taking investment action and must <b>reassess and update</b> this information regularly. (b) Determine that an investment is suitable to the client\'s financial situation and consistent with the client\'s <b>written</b> objectives, mandates, and constraints before making a recommendation or taking action. (c) Judge the suitability of investments in the context of the client\'s <b>total portfolio</b>. 2. When Members and Candidates are responsible for managing a portfolio to a <b>specific mandate, strategy, or style</b>, they must make only investment recommendations or take only investment actions that are <b>consistent with the stated objectives and constraints</b> of the portfolio.',
 textko:'자문관계: 추천 전에 고객의 경험·위험·수익목표·제약을 조사하고 정기적으로 갱신 / 서면 목표에 적합한지 판단 / 전체 포트폴리오 관점. 특정 mandate 운용: 그 mandate에 맞는 투자만.',
 plain:'<b>“고객을 먼저 알고(Know your client), 그 고객에게 맞는 것만 권하라.”</b> 처음 만난 고객에게 아무것도 묻지 않고 종목부터 추천하면 위반. 고위험 종목 하나가 있어도 <b>전체 포트폴리오</b> 위험이 적절하면 위반이 아닐 수 있습니다.',
 pts:[
  ['In advisory relationships, gather client information at the beginning in the form of an <b>investment policy statement (IPS)</b>; consider risk tolerance and whether <b>leverage</b> is suitable.','처음에 IPS 작성. 레버리지 적합성도.'],
  ['Managing a fund to an <b>index or stated mandate</b> → select only investments consistent with the mandate. (Suitability for individual investors is a concern for the <b>advisor recommending the fund</b>, not the fund manager.)','펀드매니저는 mandate만 지키면 됨.'],
 ],
 extra:`<h4>Unsolicited trade requests · 고객이 먼저 요청한 부적합 거래</h4>${table(['Situation','Response'],[
   [['Always','공통'],['Do not make the trade until you have <b>discussed with the client</b> the reasons (based on the IPS) that it is unsuitable.','IPS 근거로 왜 부적합한지 먼저 논의.']],
   [['Effect on total portfolio is <b>minimal</b>','영향 미미'],['May follow <b>firm policy</b> for unsuitable trades; client must <b>acknowledge</b> the discussion.','회사 정책 + 고객 확인.']],
   [['<b>Material</b> impact','영향 큼'],['① <b>Update the IPS</b> → ② if refused, a separate <b>client-directed account</b> → ③ reconsider the relationship.','IPS 갱신 → 별도 계좌 → 관계 재검토.']],
 ])}`,
 recM:[['Put needs, circumstances, and objectives into a <b>written IPS</b> for each client','고객별 서면 IPS'],['Consider type of client, beneficiaries, <b>objectives (return and risk)</b>, <b>constraints (liquidity, expected cash flows, time, tax, legal and regulatory)</b>, and benchmarks','목표(수익·위험) / 제약(유동성·현금흐름·기간·세금·법규)'],['Review objectives and constraints <b>periodically</b>','주기적 검토']],
 trap:[['“Must decline an unsuitable unsolicited trade” → <b>false</b>; discuss first.','무조건 거절은 오답.'],['Ignoring a trust beneficiary\'s request for a risky venture that conflicts with the IPS → <b>no violation</b>; the IPS governs.','IPS와 맞지 않는 수익자 요청을 따르지 않음 → 위반 아님.'],['Copying one brother\'s portfolio for the other “because they are similar” → violation.','비슷하다는 이유로 복사 → 위반.']]},

{g:'III',code:'III(D)',name:'Performance Presentation',ko:'성과제시',
 text:'When communicating investment performance information, Members and Candidates must make reasonable efforts to ensure that it is <b>fair, accurate, and complete</b>.',
 textko:'투자성과를 전달할 때 공정·정확·완전하도록 합리적 노력을 해야 한다.',
 plain:'성과 자랑할 때 <b>좋은 것만 골라 보여주지 마라.</b> 가장 잘된 계좌 하나, 가장 좋았던 1년만 보여주는 건 각주로 밝혀도 위반입니다. “앞으로도 이만큼 벌 수 있다”는 암시도 금지.',
 pts:[
  ['Must not misstate performance or mislead about investment performance.','성과 왜곡 금지.'],
  ['Must not misrepresent past or reasonably expected performance, and must not <b>state or imply the ability to achieve a rate of return similar to that achieved in the past</b>.','과거 같은 수익 재현 암시 금지.'],
  ['For <b>brief presentations</b>, make detailed information <b>available on request</b> and indicate that only limited information is presented.','간략 발표: 요청 시 상세 제공 명시.'],
 ],
 recM:[['Encourage firms to adhere to <b>GIPS</b>','GIPS 준수 권장'],['Consider the <b>sophistication of the audience</b>','청중 수준 고려'],['Present a <b>weighted composite</b> of similar portfolios rather than a single account','단일계좌 X, 가중 컴포지트 O'],['<b>Include terminated accounts</b> and state when they were terminated','해지계좌 포함'],['Disclose whether performance is <b>gross or net of fees</b>, model results, etc.','수수료 전/후 공시'],['Maintain data and records used to calculate performance','계산 근거 보관']],
 trap:[['Showing the best year of the last five, disclosed only in a footnote → <b>violation</b>.','최고 연도만 보여주고 각주로 밝혀도 위반.'],['“Support forecasts with actual past performance” is <b>not</b> a recommendation of this Standard.','과거 성과로 미래 예측을 뒷받침하라는 권고는 없음.']]},

{g:'III',code:'III(E)',name:'Preservation of Confidentiality',ko:'기밀유지',
 text:'Members and Candidates must keep information about <b>current, former, and prospective clients</b> confidential unless: 1. The information concerns <b>illegal activities</b> on the part of the client; 2. Disclosure is <b>required by law</b>; or 3. The client or prospective client <b>permits</b> disclosure of the information.',
 textko:'현재·과거·잠재 고객 정보는 비밀. 예외: ① 고객의 불법행위 ② 법적 요구 ③ 고객 허락.',
 plain:'고객 정보는 비밀. <b>예외는 딱 3개</b>(불법, 법적 요구, 고객 허락). 불법 예외라도 <b>당국에만</b> 알릴 수 있지 친구에게 말하면 안 됩니다. CFA 징계 조사(PCP)에 협조하는 건 OK.',
 pts:[
  ['If illegal activities by a client are involved, members may have an obligation to <b>report to authorities</b>.','불법이면 당국 신고 의무 가능.'],
  ['The Standard extends to <b>former clients</b>.','전 고객 포함.'],
  ['Not intended to prevent cooperating with a <b>PCP investigation</b>. Cooperation is <b>required</b> for one\'s own conduct and <b>encouraged</b> for others\'.','PCP 협조 OK. 본인 건 의무, 타인 건 권장.'],
 ],
 recM:[['Disclose client information only to <b>authorized coworkers</b> who also work for the client','권한 있는 동료에게만'],['Follow firm procedures for <b>storage of electronic data</b>','전자데이터 보관 절차']],
 trap:[['“Protected only for current clients” → <b>false</b>.','현재 고객만 보호 → 오답.'],['Telling a friend at a bank about a client\'s tax-evasion investigation → violation.','고객 조사 사실을 친구에게 → 위반.']]},

{g:'IV',code:'IV(A)',name:'Loyalty',ko:'고용주에 대한 충실',
 text:'In matters related to their employment, Members and Candidates must act for the benefit of their employer and not deprive their employer of the advantage of their skills and abilities, divulge confidential information, or otherwise cause harm to their employer.',
 textko:'고용과 관련된 일에서 고용주의 이익을 위해 행동하고, 능력의 이점을 빼앗거나 기밀을 누설하거나 해를 끼치면 안 된다.',
 plain:'<b>회사에 다니는 동안은 회사 편.</b> 이직 준비(사무실 임대, 회사 설립)는 OK지만, 퇴사 전에 고객을 빼가거나 고객 명단·모델을 가져가면 위반. 단, 고객·시장 보호를 위한 <b>내부고발</b>은 예외.',
 pts:[
  ['Applies to <b>employees</b>; independent contractors must abide by their agreements.','직원에게 적용.'],
  ['Place client interests above employer\'s; consider firm integrity and sustainability.','고객 > 회사.'],
  ['<b>No requirement</b> to put employer interests ahead of <b>family and personal obligations</b>.','가족보다 회사 우선일 필요 없음.'],
  ['Duty to employer may be violated to <b>protect clients or market integrity</b>, when <b>not for personal gain</b> (whistleblowing).','개인 이득 없는 내부고발은 허용.'],
  ['<b>Independent practice for compensation</b> is allowed if notification fully describes compensation, duration, and nature, and the employer <b>consents to all terms before it begins</b>.','유상 부업: 사전 통지 + 사전 동의.'],
  ['Continue to act in your employer\'s best interest <b>until resignation is effective</b>.','퇴사 효력 발생 전까지 충실.'],
  ['Employer records on any medium (home computer, tablet, cell phone) are <b>the property of the firm</b>.','모든 매체의 기록 = 회사 재산.'],
  ['Simple knowledge of names and existence of former clients is generally <b>not confidential</b>; using experience or knowledge gained is <b>not prohibited</b>.','고객 이름 기억, 경험 사용은 OK.'],
  ['Adhere to employers\' <b>social media</b> policies.','SNS 정책 준수.'],
 ],
 viol:[['<b>Misappropriation of trade secrets</b> or client lists','영업비밀·고객명단 유용'],['<b>Soliciting employer\'s clients prior to leaving</b>','퇴사 전 고객 권유'],['Self-dealing; misuse of confidential information','자기거래, 기밀 오용'],['Secretly recruiting coworkers to leave together','동료를 몰래 데리고 나가기'],['Using an outside organization\'s property (e.g., its software) for your own business','다른 조직 소유 프로그램을 내 사업에 사용 → I(D)']],
 okk:[['Leasing office space and equipment for a new business before leaving','퇴사 전 사무실 임대 등 준비'],['Soliciting former clients <b>after</b> leaving, from memory and public information','퇴사 후 기억·공개정보로 고객 접촉'],['Recreating a model <b>from memory</b> (and recreating supporting documentation)','기억으로 모델 재구성 + 문서 재작성']],
 recM:[['Give your employer a copy of the Code and Standards','Code 사본 제공'],['Use <b>separate social media accounts</b> for personal and professional use (best practice)','SNS 계정 분리']],
 recF:[['No incentive and compensation systems that encourage unethical behavior','비윤리 조장 보상 금지']],
 trap:[['Unpaid volunteer work similar to your job with a <b>free parking space</b> → compensation → disclose and get <b>written permission</b>.','무료 주차 = 보상.']]},

{g:'IV',code:'IV(B)',name:'Additional Compensation Arrangements',ko:'추가 보상 약정',
 text:'Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer\'s interest unless they obtain <b>written consent from all parties involved</b>.',
 textko:'고용주 이익과 경쟁하거나 상충할 수 있는 보상은 모든 관련 당사자의 서면 동의 없이 받으면 안 된다.',
 plain:'회사 밖에서 <b>추가 보수</b>를 받으려면 회사의 <b>서면 동의(이메일 OK)</b>가 필요합니다. 특히 고객이 “다음 분기에 수익 내면 여행 보내줄게”라고 하면 이건 <b>미래 성과</b>에 대한 보상이라 IV(B)입니다.',
 pts:[
  ['Compensation includes direct and indirect compensation from a client and other benefits from third parties.','고객·제3자로부터의 직간접 보상.'],
  ['Written consent from the employer <b>includes email</b>.','이메일도 서면 동의.'],
 ],
 extra:`${table(['Client offers…','Classification','Requirement'],[
   [['Bonus for <b>future performance</b>','미래 성과'],['Additional compensation arrangement → <b>IV(B)</b>','추가보상 약정'],['<b>Written consent in advance</b>','사전 서면 동의']],
   [['Gift for <b>past performance</b>','과거 성과'],['Gift → <b>I(B)</b>','선물'],['<b>Disclose</b> to employer','고용주에 공시']],
 ])}`,
 recM:[['Make an <b>immediate written report</b> to your employer detailing proposed compensation and services','즉시 서면 보고'],['Part-time hires: discuss competing arrangements <b>when hired</b>','파트타임은 채용 시 논의']],
 recF:[['Details of additional compensation should be <b>verified by the offering party</b>','제공자가 내용 검증']],
 trap:[['“Inform employer, no permission needed” → <b>wrong</b> for future-performance bonuses.','미래 성과 보너스는 허가 필요.']]},

{g:'IV',code:'IV(C)',name:'Responsibilities of Supervisors',ko:'감독자의 책임',
 text:'Members and Candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rules, regulations, and the Code and Standards.',
 textko:'감독하는 모든 사람이 법규와 Code·Standards를 지키도록 합리적 노력을 해야 한다.',
 plain:'관리자는 부하 직원의 위반을 <b>예방하고 찾아낼</b> 책임이 있습니다. 회사 컴플라이언스 체계가 엉망이면 사직이 아니라 <b>“제대로 된 절차가 생길 때까지 감독 책임을 서면으로 거절”</b>이 정답. 위반이 의심되면 <b>조사하면서 해당 직원 활동을 제한</b>.',
 pts:[
  ['Reasonable efforts to <b>prevent</b> and to <b>detect</b> violations.','예방 + 적발.'],
  ['An adequate compliance system must meet industry standards, regulatory requirements, and the Code and Standards.','적절한 시스템의 기준.'],
  ['Bring an inadequate compliance system to <b>management\'s attention</b> and recommend corrective action.','경영진에 알리고 시정 권고.'],
  ['With no or inadequate procedures → <b>decline in writing</b> to accept supervisory responsibility until adequate procedures are adopted.','서면으로 감독 책임 거절.'],
  ['If a violation occurs → respond promptly, conduct a <b>thorough investigation</b>, and <b>increase supervision or limit the wrongdoer\'s activities</b>.','조사 + 활동 제한/감독 강화.'],
  ['Supervisors may <b>delegate</b> duties but <b>retain responsibility</b>; they apply to all subordinates, even those not subject to the Code.','위임해도 책임 유지. CFA 아닌 직원도 감독 대상.'],
 ],
 recM:[['Recommend the employer adopt a code of ethics','윤리강령 채택 권고'],['Once a compliance program exists: <b>distribute</b> it, <b>update</b> it, <b>educate</b> staff, issue <b>reminders</b>, require <b>professional conduct evaluations</b>, <b>review employee actions</b>','배포·갱신·교육·리마인드·평가·검토']],
 recF:[['<b>Do not commingle</b> compliance procedures with the code of ethics','컴플라이언스와 윤리강령 섞지 말 것'],['Adequate procedures: clearly written, easy to understand, designated compliance officer, <b>checks and balances</b>, scope, permitted conduct, reporting and sanctions, incentives that don\'t reward unethical behavior','적절한 절차의 요건']],
 trap:[['Reporting to management and issuing a written warning only → <b>not sufficient</b>.','보고·경고만으론 부족.'],['Restricting a trader\'s duties during an investigation → <b>appropriate</b>, not a violation.','조사 중 업무 제한 = 적절.']]},

{g:'V',code:'V(A)',name:'Diligence and Reasonable Basis',ko:'성실과 합리적 근거',
 text:'Members and Candidates must: 1. Exercise <b>diligence, independence, and thoroughness</b> in analyzing investments, making investment recommendations, and taking investment actions. 2. Have a <b>reasonable and adequate basis</b>, supported by appropriate research and investigation, for any investment analysis, recommendation, or action.',
 textko:'성실·독립·철저하게 분석하고, 적절한 리서치에 근거한 합리적 근거를 가져야 한다.',
 plain:'추천에는 <b>근거</b>가 있어야 합니다. 취미로 써본 제품이 좋아서, 경영진 말만 듣고 Buy를 내면 위반. 남의 리서치를 쓸 때는 <b>가정과 객관성을 검토하는 게 의무</b>입니다.',
 pts:[
  ['The required level of diligence depends on the investment philosophy, the member\'s role, and the employer\'s resources; it differs by product or service.','상황에 따라 필요한 수준이 다름.'],
  ['Consider: <b>global and national economic conditions</b>; a firm\'s financial results, operating history, and <b>business cycle stage</b>; <b>fees and historical results</b> for a mutual fund; <b>limitations of quantitative models</b>; whether <b>peer group comparisons</b> are appropriate.','경제, 재무·경기국면, 펀드 수수료·실적, 모델 한계, 동종비교.'],
  ['Using <b>third-party research</b>: reviewing its assumptions and evaluating its independence and objectivity is <b>required</b>.','제3자 리서치 검토 = 의무.'],
 ],
 recM:[['Criteria for third-party research: <b>assumptions</b> used, <b>rigor</b> of analysis, <b>timeliness</b>, <b>objectivity and independence</b>','가정·엄밀성·적시성·객관성'],['Encourage firms to: require research to have a substantiated basis; written due-diligence guidance; <b>measurable quality criteria</b> (base analyst pay on them); scenario testing for models; evaluate outside information providers and external advisers','회사 정책 권장 사항']],
 trap:[['“Compensate analysts based on research quality” is <b>recommended</b>, not required.','품질연동 보상은 권고.'],['Relying solely on a detailed subscription service without due diligence on it → should conduct additional due diligence on the provider.','외부 리서치에만 의존 → 제공자 실사 필요.'],['Reviewing external advisers: check adherence to strategy, performance measures, and <b>internal controls</b>.','외부 운용사 실사 항목.']]},

{g:'V',code:'V(B)',name:'Communication with Clients and Prospective Clients',ko:'고객 커뮤니케이션',
 text:'Members and Candidates must: 1. Disclose the <b>nature of the services</b> provided, along with information about the <b>costs</b> to the client. 2. Disclose the <b>basic format and general principles</b> of the investment processes they use to analyze investments, select securities, and construct portfolios, and must promptly disclose any <b>changes</b> that might materially affect those processes. 3. Disclose <b>significant limitations and risks</b> associated with the investment process. 4. Use reasonable judgment in identifying which <b>factors are important</b> and include those factors in communications. 5. <b>Distinguish between fact and opinion</b> in the presentation of investment analysis and recommendations.',
 textko:'① 서비스 내용과 비용 ② 투자 프로세스와 그 변경 ③ 한계와 위험 ④ 중요한 요인 ⑤ 사실과 의견의 구분.',
 plain:'고객에게 <b>무엇을, 얼마에, 어떻게 하는지, 무엇이 위험한지</b> 알려야 합니다. 그리고 <b>예측은 의견</b>이지 사실이 아니라는 걸 분명히 해야 합니다.',
 pts:[
  ['Covers <b>all means and types</b> of communication, not just research reports.','모든 커뮤니케이션.'],
  ['Disclose services and costs at initiation and on an ongoing basis. <b>Specific money amounts are not required</b> (e.g., percentage fees), but reasonably detailed cost information including <b>third-party costs</b> is.','구체 금액 불필요, 상세 비용정보는 필요.'],
  ['<b>Expectations based on statistical modeling and analysis are not facts.</b> Include the basic characteristics of the security analyzed.','통계 예측 = 의견.'],
  ['For nontraditional investments, communicate the <b>specific risk factors</b>; describe potential gains and losses in terms of <b>total returns</b>.','특유의 위험, 총수익 관점.'],
  ['Communicate significant changes in risk characteristics; explain <b>model limitations and assumptions</b>.','위험 변화, 모델 한계.'],
  ['Inform clients of inherent limitations such as <b>liquidity</b> (exit without significant extra cost) and <b>capacity</b> (absorb additional investment without reducing returns).','유동성·용량 한계.'],
 ],
 recM:[['Maintain records indicating the nature of the research; supply additional information if requested','리서치 성격 기록']],
 trap:[['Showing only scenarios where the euro rises → violation (no downside scenario).','상승 시나리오만 → 위반.'],['Shifting allocation based on a rate view → tell clients it is an <b>opinion</b>, not a fact.','금리 전망은 의견임을 밝힐 것.'],['Omitting a sharp drop in insider buying from a report → may violate V(B).','중요 요인 누락.']]},

{g:'V',code:'V(C)',name:'Record Retention',ko:'기록보존',
 text:'Members and Candidates must develop and maintain appropriate records to support their investment analyses, recommendations, actions, and other investment-related communications with clients and prospective clients.',
 textko:'투자분석·추천·행위·고객 커뮤니케이션을 뒷받침하는 기록을 작성하고 보관해야 한다.',
 plain:'근거 자료를 남겨라. 기록은 <b>회사 재산</b>이라 이직하면 가져갈 수 없고 <b>공개정보로 다시 만들어야</b> 합니다. 규정이 없으면 <b>최소 7년</b> 보관 권고.',
 pts:[
  ['Records are the <b>property of the firm</b>. Communications via any medium (<b>emails, text messages</b>) are records.','기록=회사 재산. 이메일·문자 포함.'],
  ['A member who changes firms must <b>re-create</b> documentation using public information or information from the company, and <b>must not rely on memory or materials from the previous firm</b>.','이직 시 재작성.'],
  ['If no regulatory standards or firm policies: <b>seven-year minimum</b> holding period (recommended).','규정 없으면 최소 7년.'],
  ['Recordkeeping is generally the <b>firm\'s responsibility</b>.','일반적으로 회사 책임.'],
 ],
 trap:[['Taking prior performance records and research from a former employer, <b>with permission</b> → no violation.','허락받고 가져가면 OK.'],['Shredding all working documents after publishing a report → violation.','작성 후 자료 파쇄 → 위반.'],['Unsure if the firm meets 7 years → review procedures with supervisor/compliance (not keep personal copies at home).','개인 사본 보관이 아니라 상사·컴플라이언스와 검토.']]},

{g:'VI',code:'VI(A)',name:'Avoid or Disclose Conflicts',ko:'이해상충 회피·공시',
 text:'Members and Candidates must <b>avoid or make full and fair disclosure</b> of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and Candidates must ensure that such disclosures are <b>prominent, are delivered in plain language, and communicate the relevant information effectively</b>.',
 textko:'독립성을 해치거나 의무를 방해할 수 있는 모든 사항은 피하거나 완전·공정하게 공시. 공시는 눈에 띄게, 쉬운 말로.',
 plain:'내 이익이 끼어 있으면 <b>숨기지 마라.</b> 추천 종목을 내가(또는 가족이) 갖고 있거나, 그 회사에 입사 면접 중이거나, 이사회 멤버라면 고용주·고객에게 알려야 합니다.',
 pts:[
  ['Avoid conflicts when possible; otherwise <b>fully disclose</b> to clients, prospects, and employers.','회피 우선, 안 되면 공시.'],
  ['Examples: broker-dealer <b>market-making</b>, <b>board service</b>, <b>stock ownership</b> (most common), <b>compensation/bonus structures</b>.','시장조성, 이사회, 주식보유, 보상구조.'],
  ['Give employers enough information to judge the impact of a conflict; report conflicts <b>promptly</b>.','고용주에 충분한 정보, 신속 보고.'],
  ['<b>Beneficial ownership</b> includes shares held in trust where the member has a pecuniary interest or voting power.','신탁 주식도 실질소유일 수 있음.'],
 ],
 trap:[['Writing on a firm where you are <b>interviewing for a job</b> and where a relative holds shares → disclose <b>both</b>.','입사 면접 + 친척 보유 둘 다 공시.'],['Father is a major shareholder of a recommended hedge fund → disclose to <b>employer</b> and follow its guidance on client disclosure.','아버지 회사 추천 → 고용주에 먼저 공시.'],['Payments from subadvisers based on assets placed → disclose to clients.','하위자문사로부터 대가 → 공시.']]},

{g:'VI',code:'VI(B)',name:'Priority of Transactions',ko:'거래 우선순위',
 text:'Investment transactions for clients and employers must have priority over investment transactions in which a Member or Candidate is the <b>beneficial owner</b>.',
 textko:'고객·고용주의 거래가 회원이 실질소유자인 거래보다 우선해야 한다.',
 plain:'<b>고객 먼저, 회사 다음, 나는 마지막.</b> 고객 대량 주문 전에 내 계좌로 먼저 사는 <b>front-running</b>은 대표적 위반. 고객이 충분히 반응할 기회를 준 뒤라면 같은 종목을 사도 됩니다.',
 pts:[
  ['Personal transactions may be undertaken only after clients and the employer have had an <b>adequate opportunity to act</b>.','고객·회사가 행동할 기회를 가진 후.'],
  ['<b>Family member accounts that are client accounts</b> should not be disadvantaged.','가족 고객계좌 불이익 금지.'],
  ['Must not act on information about <b>pending trades</b> for personal gain. Personal trades must <b>not disadvantage clients</b>.','대기 주문 정보 이용 금지.'],
  ['When requested, disclose the firm\'s <b>personal trading policies</b> to investors.','요청 시 개인거래 정책 공시.'],
  ['Personal trades <b>contrary</b> to the firm\'s recommendation are <b>not prohibited</b> if they do not disadvantage clients.','반대 방향 거래 자체는 허용.'],
 ],
 recM:[['Avoid IPO conflicts by <b>not participating in IPOs</b>','IPO 불참']],
 recF:[['Limit employee participation in <b>equity IPOs</b>; restrict <b>private placements</b>','IPO·사모 제한'],['<b>Blackout/restricted periods</b> before client trades — no <b>front running</b>','블랙아웃 기간'],['<b>Reporting procedures</b>: duplicate trade confirmations, disclosure of personal holdings and beneficial ownership, <b>preclearance</b>','거래확인서 사본, 보유 공시, 사전승인']],
 trap:[['Advising clients to sell, then selling your own holding 24 hours later → <b>congruent</b> with VI(B).','고객에게 먼저 알리고 하루 뒤 매도 = OK.'],['“Personal holdings should not be reported to employers for confidentiality” → <b>conflicts</b> with recommended procedures.','개인 보유를 보고하지 말라는 것은 권고와 반대.'],['Adding your own shares to a large client sell order you expect to move the price → violation.','고객 대량 매도 주문에 내 주식을 끼워 팖 → 위반.']]},

{g:'VI',code:'VI(C)',name:'Referral Fees',ko:'소개수수료',
 text:'Members and Candidates must disclose to their <b>employer, clients, and prospective clients</b>, as appropriate, any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services.',
 textko:'상품·서비스 추천의 대가로 받거나 준 모든 보상을 고용주·고객·잠재고객에게 공시해야 한다.',
 plain:'“이 회사 소개해 드릴게요” 뒤에 <b>소개비</b>가 있다면 알려야 합니다. 고객이 <b>총비용과 추천의 편파성</b>을 판단할 수 있게 하는 게 목적. 공시는 <b>계약 전(관계 시작 시점)</b>에.',
 pts:[
  ['Disclosure allows clients to evaluate the <b>full cost</b> of the service and any <b>potential partiality</b>.','총비용·편파성 판단.'],
  ['<b>All types of consideration</b> must be disclosed (cash, research, referrals in return, discounts, gifts).','모든 형태의 대가.'],
  ['Disclose <b>before</b> the client enters into the relationship; disclosing only after they become clients may not satisfy the Standard.','관계 시작 전 공시.'],
 ],
 recM:[['Encourage clear procedures on referral compensation; update employers <b>at least quarterly</b>','고용주에 분기 1회 업데이트']],
 recF:[['Firms that do not prohibit referral fees should have clear <b>approval procedures</b> and policies on the nature and value of referral compensation','승인 절차·정책']],
 trap:[['Must disclose the <b>nature and value</b> of the arrangement (e.g., $1,000 per referral) at the time of referral.','금액·성격까지 소개 시점에 공시.'],['Purpose of disclosure: help the client evaluate <b>partiality</b> — not to request discounts.','목적 = 편파성 판단.']]},

{g:'VII',code:'VII(A)',name:'Conduct as Participants in CFA Institute Programs',ko:'CFA 프로그램 참가자로서의 행위',
 text:'Members and Candidates must not engage in any conduct that compromises the reputation or integrity of CFA Institute or the CFA designation or the integrity, validity, or security of CFA Institute programs.',
 textko:'CFA Institute·CFA 명칭의 평판과 무결성, 프로그램의 무결성·타당성·보안을 해치는 행위를 하면 안 된다.',
 plain:'<b>시험 내용 유출 금지, 부정행위 금지.</b> “이번 시험에 파생상품 문제가 하나도 없었다”도 유출입니다. 하지만 “CFA Institute 운영이 별로다” 같은 <b>비판·의견은 자유</b>.',
 viol:[['<b>Cheating</b> on the CFA exam or any exam','부정행위'],['Revealing <b>broad or specific topics tested</b>, content of questions, or formulas required or not required','출제 주제·문제·공식 공개'],['Not following exam rules (calculator, personal belongings, <b>Candidate Pledge</b>), e.g., writing after “pencils down”','시험 규정 위반(종료 후 마킹)'],['Giving confidential information on the CFA Program to candidates or the public','기밀 정보 제공'],['Improperly using the designation; misrepresenting information on the <b>PCS</b>','명칭 오용, PCS 허위'],['Volunteers soliciting or revealing questions, grading, or scoring','자원봉사자 정보 공개'],['Copying and selling copyrighted prep materials (also I(A))','저작권 자료 복제·판매']],
 okk:[['Expressing <b>opinions</b> or disagreeing with CFA Institute policies','의견·비판 표현'],['Sharing candidates\' general opinions on exam <b>difficulty</b>','난이도에 대한 일반적 의견'],['Participating in CFA-related internet forums','CFA 관련 포럼 참여']],
 trap:[['“None of the questions touched on Alternative Investments” → violation (topic not tested is still exam content).','안 나온 주제 공개도 위반.'],['“I don\'t think CFA Institute tested fairly; the X rule wasn\'t on the exam” → violation because it reveals content.','불만 표시 자체는 OK지만 출제 내용을 밝히면 위반.']]},

{g:'VII',code:'VII(B)',name:'Reference to CFA Institute, the CFA Designation, and the CFA Program',ko:'CFA 명칭·프로그램 언급',
 text:'When referring to CFA Institute, CFA Institute membership, the CFA designation, or candidacy in the CFA Program, Members and Candidates must not <b>misrepresent or exaggerate</b> the meaning or implications of membership in CFA Institute, holding the CFA designation, or candidacy in the CFA Program.',
 textko:'CFA 회원 자격·명칭·응시자 신분의 의미를 거짓으로 말하거나 과장하면 안 된다.',
 plain:'<b>사실은 OK, 과장은 금지.</b> “3번 모두 한 번에 합격” = OK. “CFA라서 더 높은 수익을 낼 것” = 위반. 아직 차터를 받지 않았는데 쓰거나, 회비 안 냈는데 쓰거나, “CFA Level II”처럼 <b>부분 자격</b>을 암시하면 위반.',
 pts:[
  ['No promotional promises tied to the designation — <b>over-promising competence or future investment results</b> (higher performance, less risk).','성과·역량 과장 금지.'],
  ['To maintain membership: <b>sign the PCS annually</b> and <b>pay dues annually</b>; otherwise no longer an active member.','매년 PCS 서명 + 회비.'],
  ['<b>There is no partial CFA designation.</b>','부분 자격 없음.'],
  ['Stating a candidate passed all three exams in three years (if true) is acceptable; <b>claiming superior ability</b> because of this is not.','사실은 OK, 우월성 주장 X.'],
 ],
 extra:`<h4>Proper use of the marks · 표기 규칙 (Handbook 보충)</h4>${table(['✓ Correct','✗ Incorrect'],[
   ['John Kim, CFA','John Kim, C.F.A. / a CFA'],
   ['CFA charterholder · CFA designation','CFAs · CFA-type portfolio'],
   ['Level II candidate in the CFA Program','CFA Level II · “CFA (Level II)”'],
   ['“Passed all three levels on the first attempt”','“Completed the CFA course” (implies the charter)'],
 ])}`,
 recM:[['Make sure your firm knows the proper references to your designation or candidacy','회사에 올바른 표기 안내']],
 trap:[['Claiming to have passed Level II when you did not sit the exam → <b>VII(B)</b> (referencing candidacy).','시험 안 봤는데 합격했다고 → VII(B).'],['Using the designation before the charter is awarded, or implying superior performance → violation.','차터 받기 전 사용·우월 성과 암시 → 위반.'],['“M.S. in Finance” on cards before the degree is awarded → <b>I(C)</b> Misrepresentation (not VII(B)).','학위 받기 전 명함 기재 → I(C).']]},
];

const GROUPS=[['I','Professionalism','전문가 정신'],['II','Integrity of Capital Markets','자본시장 무결성'],['III','Duties to Clients','고객에 대한 의무'],['IV','Duties to Employers','고용주에 대한 의무'],['V','Investment Analysis, Recommendations, and Actions','투자분석·추천·행위'],['VI','Conflicts of Interest','이해상충'],['VII','Responsibilities as a CFA Institute Member or CFA Candidate','CFA 회원·응시자 책임']];

function stdCard(s){
  const pairList=a=>`<ul>${a.map(x=>`<li><span class="en">${x[0]}</span>${x[1]?`<span class="ko">${x[1]}</span>`:''}</li>`).join('')}</ul>`;
  return `<article class="std" id="s-${s.code.replace(/[()]/g,'')}" style="--c:${cvar(s.g)}">
   <div class="sh"><span class="code">${s.code}</span><span class="sn">${s.name}</span><span class="sk">${s.ko}</span></div>
   <div class="sb">
    ${quote(s.text,s.textko)}
    ${plain(s.plain)}
    ${s.pts?`<h4>Key points · 핵심</h4>${li(s.pts)}`:''}
    ${s.extra||''}
    ${(s.viol||s.okk)?`<div class="grid2">${s.viol?`<div class="box bad"><h4>Violation · 위반</h4>${pairList(s.viol)}</div>`:''}${s.okk?`<div class="box good"><h4>Not a violation · 위반 아님</h4>${pairList(s.okk)}</div>`:''}</div>`:''}
    ${(s.recM||s.recF)?`<details><summary>Recommendations · 권고사항 (Members / Firms)</summary><div>${s.recM?`<h4>Recommendations for Members</h4>${li(s.recM)}`:''}${s.recF?`<h4>Recommendations for Firms</h4>${li(s.recF)}`:''}</div></details>`:''}
    ${s.trap?trap(s.trap):''}
   </div></article>`;
}
const R91=()=>`<h2 class="rt">R91 · Guidance for Standards I–VII</h2>
<p class="rsub">7 Standards · 23 subsections — 각 카드: 원문 → 쉽게 말하면 → 핵심 → 위반/비위반 → 권고사항 → 함정</p>
<div class="chips">${GROUPS.map(g=>`<button class="chip" style="--c:${cvar(g[0])}" data-g="${g[0]}"><i></i>${g[0]}</button>`).join('')}</div>
${GROUPS.map(g=>`<section class="grp" id="g-${g[0]}" style="--c:${cvar(g[0])}"><h3><span class="gn">Standard ${g[0]}</span>${g[1]} <span class="sk" style="font-weight:500;color:var(--muted);font-size:14px">${g[2]}</span></h3>${STD.filter(s=>s.g===g[0]).map(stdCard).join('')}</section>`).join('')}`;

/* ---------- R92 ---------- */
const R92=`<div class="col">
<h2 class="rt">R92 · Introduction to the Global Investment Performance Standards (GIPS)</h2>
<p class="rsub">운용사 성과보고의 국제 표준 · LOS 92.a–e</p>
