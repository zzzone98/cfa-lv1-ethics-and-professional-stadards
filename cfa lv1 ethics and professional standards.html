{r:'R90',s:'',q:'A member rejects the disciplinary sanction proposed by Professional Conduct staff. The matter is <b>most likely</b>:',o:['closed with a cautionary letter.','referred to a disciplinary review panel for a hearing.','decided immediately by the Board of Governors.'],a:1,e:'If the sanction is rejected, the matter is referred to a <b>disciplinary review panel</b> of CFA Institute members for a hearing.',k:'거부 시 징계심사패널 청문.'},
{r:'R90',s:'',q:'Which of the following is a component of the CFA Institute <b>Code of Ethics</b>?',o:['Disclose referral fees to clients and prospective clients.','Place the integrity of the investment profession and the interests of clients above their own personal interests.','Retain records supporting recommendations for at least seven years.'],a:1,e:'B is one of the six Code components. Referral fees (VI(C)) and record retention (V(C)) are Standards.',k:'B만 Code. A·C는 Standards.'},
// R91 I
{r:'R91',s:'I',q:'Kim, CFA, lives in Country X (no insider-trading law) and does business in Country Y, whose law is stricter than the Code and Standards. Kim must comply with:',o:['the Code and Standards, because they are stricter than Country X law.','Country Y law, because it is the strictest applicable rule.','Country X law, because it is her country of residence.'],a:1,e:'Under I(A), follow the <b>most strict</b> of the applicable laws, rules, and the Code and Standards.',k:'가장 엄격한 것.'},
{r:'R91',s:'I',q:'Lopez, CFA, finds that her firm\'s marketing brochure overstates the team\'s experience. She tells her supervisor, but nothing changes. Her <b>most appropriate</b> action is to:',o:['report the firm to CFA Institute and regulators, as the Standards require.','dissociate from the activity by refusing to use the brochure and document what she found.','take no further action because she has informed her supervisor.'],a:1,e:'If the firm will not remedy the violation, she must <b>dissociate</b> and keep records. Reporting to CFA Institute is strongly encouraged but <b>not required</b>.',k:'분리 + 기록. CFA 신고는 의무 아님.'},
{r:'R91',s:'I',q:'Park, CFA, is invited on a site visit by a company he covers. Commercial flights to the factory are readily available, but the company offers its private jet and a stay at a luxury resort. To comply with I(B), Park should <b>most likely</b>:',o:['accept, since all analysts on the trip receive the same treatment.','pay for commercial travel and his own lodging.','accept the jet but pay for lodging.'],a:1,e:'Members should pay their own travel when practicable and use corporate aircraft only when commercial travel is not an alternative. Luxury lodging could compromise objectivity.',k:'상업 항공편 있으면 직접 부담.'},
{r:'R91',s:'I',q:'An issuer pays Chen\'s research firm to cover its stock. Which arrangement is <b>most likely</b> consistent with I(B)?',o:['A flat fee, with the report disclosing that it is issuer-paid.','A bonus if the report rates the stock “Buy.”','A fee tied to the stock\'s price change after publication, disclosed in the report.'],a:0,e:'Issuer-paid research is acceptable if compensation is a <b>flat rate not tied to conclusions or market impact</b> and the arrangement is <b>disclosed</b>.',k:'정액 + 공시.'},
{r:'R91',s:'I',q:'After a strong year, a client sends Ito, CFA, a case of expensive wine as thanks. Under the Standards, Ito should:',o:['obtain written consent from her employer before accepting.','disclose the gift to her employer, before accepting if possible.','refuse the gift because it exceeds token value.'],a:1,e:'A gift for <b>past</b> performance from a client falls under I(B): <b>disclose</b> to the employer (before acceptance if possible). Written consent is required for future-performance arrangements (IV(B)).',k:'과거 성과 선물 → 공시.'},
{r:'R91',s:'I',q:'Which statement in a sales meeting <b>most likely</b> violates I(C)?',o:['“U.S. Treasury bills are backed by the U.S. government.”','“Our private credit fund will return at least 9% a year.”','“This bank CD is insured up to the deposit-insurance limit.”'],a:1,e:'Guaranteeing a specific return on a security <b>without an explicit guarantee</b> is misrepresentation. A and C describe real guarantees.',k:'보증 없는 수익 보장 = 위반.'},
{r:'R91',s:'I',q:'Analyst Wu uses a GDP table from the national statistics office and a valuation model built by a competitor, citing neither. Wu has violated I(C) by:',o:['using the GDP table only.','using the competitor\'s model only.','using both.'],a:1,e:'Data from <b>recognized statistical reporting services</b> need not be cited. Using another firm\'s model without credit is <b>plagiarism</b>.',k:'공인 통계는 OK, 남의 모델 무인용은 표절.'},
{r:'R91',s:'I',q:'Which conduct is <b>most likely</b> a violation of I(D) Misconduct?',o:['Being arrested at a peaceful protest for blocking a road.','Inflating a travel expense claim, then repaying it after the supervisor asks.','Writing a negative but accurate review of a competitor\'s fund.'],a:1,e:'Inflating expenses involves <b>dishonesty</b> and reflects on integrity — repayment does not cure it. Civil disobedience does not necessarily reflect on honesty.',k:'경비 부풀리기 = 부정행위(반납해도).'},
// II
{r:'R91',s:'II',q:'Rao, CFA, combines public filings with conversations with a company\'s suppliers and a count of trucks at its plant, and concludes sales are weakening. None of the pieces is material on its own. Rao issues a “Sell.” Rao has:',o:['violated II(A) by acting on nonpublic information.','not violated the Standards.','an obligation to make the supplier information public before acting.'],a:1,e:'Combining public and <b>non-material nonpublic</b> information is the <b>mosaic theory</b> — permitted.',k:'모자이크 이론 → 위반 아님.'},
{r:'R91',s:'II',q:'Dunn, CFA, hears from her brother, a company accountant, that earnings due tomorrow are far below forecasts. A client order to buy the stock arrives. Dunn\'s <b>most appropriate</b> action is to:',o:['execute the client order without comment.','tell the client to wait one day without explaining why.','inform compliance that she has material nonpublic information so the stock can be restricted.'],a:2,e:'She must not act or cause others to act. Telling compliance so the stock is placed on a restricted list is the appropriate step.',k:'컴플라이언스에 알려 제한 종목 지정.'},
{r:'R91',s:'II',q:'Information disclosed only to analysts on a company conference call is <b>best</b> described as:',o:['public, because many analysts heard it.','nonpublic until disseminated to the marketplace.','immaterial, because it was disclosed voluntarily.'],a:1,e:'An <b>analyst conference call is not public disclosure</b>; selective disclosure creates insider-trading risk.',k:'애널리스트 콜 = 미공개.'},
{r:'R91',s:'II',q:'Green holds a short position and posts false claims about the company\'s management on investor message boards. Green has <b>most likely</b> violated:',o:['Market Manipulation.','Fair Dealing.','Communication with Clients.'],a:0,e:'Spreading false information to affect prices with the intent to mislead is <b>information-based market manipulation</b> (II(B)).',k:'허위정보 유포 = 시장조작.'},
{r:'R91',s:'II',q:'A hedge fund manager buys a stock and simultaneously writes puts on it as part of a disclosed arbitrage strategy. The trades move the price slightly. The manager has <b>most likely</b>:',o:['violated II(B) because prices moved.','not violated the Standards.','violated VI(A) by not notifying clients of each trade in advance.'],a:1,e:'II(B) requires <b>intent to mislead</b>. A legitimate strategy known to investors is not manipulation, and there is no duty to pre-disclose each trade.',k:'의도 없는 정당한 전략 → 위반 아님.'},
// III
{r:'R91',s:'III',q:'A manager pays for the firm\'s office rent using client brokerage commissions (soft dollars). This <b>most likely</b> violates:',o:['III(A) Loyalty, Prudence, and Care.','III(B) Fair Dealing.','No Standard, if clients gave the manager discretion over brokerage.'],a:0,e:'Soft dollars are the <b>client\'s asset</b> and must benefit the client. Paying the firm\'s operating expenses violates III(A).',k:'소프트달러로 운영비 → III(A) 위반.'},
{r:'R91',s:'III',q:'A plan sponsor asks the manager of its underfunded pension plan to invest much more aggressively. The manager should:',o:['comply, because the duty of loyalty is owed to the sponsor.','decline if the added risk is not in the best interest of the plan\'s beneficiaries.','comply, but only after disclosing the risk to the sponsor.'],a:1,e:'For pension plans, the duty of loyalty is owed to the <b>beneficiaries</b>, not the sponsor.',k:'충실의무 = 수익자.'},
{r:'R91',s:'III',q:'Moss, CFA, votes proxies only when the expected benefit exceeds the cost, and discloses this policy to clients. Moss is:',o:['in compliance with the Standards.','violating III(A) because all proxies must be voted.','violating I(D) Misconduct.'],a:0,e:'Due to cost-benefit considerations, it <b>may not be necessary to vote all proxies</b>.',k:'비용-편익 기반 의결권 정책 OK.'},
{r:'R91',s:'III',q:'An analyst changes her rating from “Buy” to “Sell” and phones her five largest institutional clients before emailing the change to everyone else. This <b>most likely</b>:',o:['complies, because institutional clients pay higher fees.','violates III(B) Fair Dealing.','complies if the firm discloses tiered service levels.'],a:1,e:'Changes must be disseminated so all clients have a <b>fair opportunity to act</b>. Giving some clients the change first disadvantages others. Premium services can add depth, not timing advantages on recommendation changes.',k:'일부 고객에게 먼저 알림 → 공정대우 위반.'},
{r:'R91',s:'III',q:'An oversubscribed IPO suits a growth strategy that includes several accounts of employees\' family members (who pay standard fees). The firm should allocate shares:',o:['pro rata to all growth accounts, excluding family accounts.','pro rata to all growth accounts, including family accounts.','to family accounts only after other clients are filled.'],a:1,e:'Family-member accounts that are client accounts are treated like <b>any other client</b> — no advantage, no disadvantage.',k:'가족 고객계좌 포함 비례 배분.'},
{r:'R91',s:'III',q:'A client asks his adviser to buy a speculative stock that conflicts with his IPS. The position would be small relative to the total portfolio. The adviser should <b>first</b>:',o:['refuse the trade.','discuss with the client why the trade is unsuitable under the IPS.','update the IPS to a higher risk tolerance.'],a:1,e:'For unsolicited trades, discuss the unsuitability first. With a <b>minimal</b> effect, the adviser may then follow firm policy with the client\'s acknowledgment.',k:'먼저 논의. 영향 작으면 회사 정책.'},
{r:'R91',s:'III',q:'The manager of an S&P 500 index fund buys several small-cap stocks outside the index to boost returns. The manager has <b>most likely</b> violated:',o:['III(C) Suitability.','V(B) Communication with Clients.','No Standard, if the fund outperforms.'],a:0,e:'When managing to a stated mandate, the manager may take only actions <b>consistent with the stated objectives and constraints</b>.',k:'mandate 위반 = III(C).'},
{r:'R91',s:'III',q:'A fact sheet shows a fund\'s 1-year return of 41%, its best year of the last six, with a footnote saying so. This is:',o:['acceptable because the footnote discloses the period.','a violation of III(D) Performance Presentation.','acceptable if the return is gross of fees.'],a:1,e:'Selecting the best period creates a misleading impression; performance must be <b>fair, accurate, and complete</b>. A footnote does not cure it.',k:'최고 연도만 → 각주가 있어도 위반.'},
{r:'R91',s:'III',q:'Which statement about III(E) Preservation of Confidentiality is <b>least</b> accurate?',o:['It applies only to current clients.','Members may share confidential client information with the CFA Institute PCP.','Information about a client\'s illegal activities may be disclosed to authorities.'],a:0,e:'Confidentiality applies to <b>current, former, and prospective</b> clients.',k:'현재 고객만 → 틀림.'},
// IV
{r:'R91',s:'IV',q:'Before resigning, Hale, CFA, plans her own advisory firm. Which action is <b>least likely</b> a violation of her duty to her employer?',o:['Leasing office space and equipment for the new firm.','Calling her employer\'s clients to tell them about the new firm.','Copying her employer\'s client contact list.'],a:0,e:'Making <b>preparations</b> is allowed. Soliciting clients before leaving and taking client lists violate IV(A).',k:'준비는 OK. 퇴사 전 권유·명단 반출 X.'},
{r:'R91',s:'IV',q:'Ortiz, CFA, built a pricing model at his old firm and was not allowed to copy it. At his new firm he rebuilds it from memory. He <b>most likely</b>:',o:['violated IV(A) because the model belongs to his former employer.','complies if he also re-creates the supporting documentation.','complies only if he changes the model substantially.'],a:1,e:'He may recreate from memory, but must <b>re-create supporting documentation</b> to satisfy V(C) Record Retention.',k:'기억 재구성 OK + 문서 재작성.'},
{r:'R91',s:'IV',q:'A client offers Bauer, CFA, a week at a resort if her account beats its benchmark next quarter. Bauer must:',o:['inform her employer; permission is not needed.','obtain her employer\'s written consent before accepting.','reject the offer because it conflicts with other clients.'],a:1,e:'A benefit tied to <b>future performance</b> is an additional compensation arrangement under IV(B) — requires <b>written consent</b> (email acceptable).',k:'미래 성과 → 서면 동의.'},
{r:'R91',s:'IV',q:'A supervisor finds suspicious trades by a trader. He restricts the trader\'s duties during the investigation and refers the matter to compliance. He has:',o:['complied with IV(C).','violated IV(C) by failing to prevent the trades.','violated IV(C) by restricting duties before the investigation ends.'],a:0,e:'Supervisors should respond promptly, investigate, and <b>limit the suspected employee\'s activities</b> during the investigation.',k:'조사 + 활동 제한 = 적절.'},
{r:'R91',s:'IV',q:'Newly promoted, Diaz, CFA, finds her firm has no written supervisory procedures. Her <b>most appropriate</b> action is to:',o:['accept the role and draft procedures herself later.','decline in writing to accept supervisory responsibility until adequate procedures are adopted.','resign from the firm.'],a:1,e:'With no or inadequate compliance procedures, a member should <b>decline in writing</b> to accept supervisory responsibility until reasonable procedures are adopted.',k:'서면으로 감독 책임 거절.'},
{r:'R91',s:'IV',q:'Supervisors who delegate supervisory duties to subordinates:',o:['are no longer responsible for those duties.','retain responsibility for instructing subordinates on preventing and detecting violations.','are responsible only for subordinates who are CFA members.'],a:1,e:'Delegation does not remove responsibility; supervision covers <b>all</b> subordinates, members or not.',k:'위임해도 책임 유지.'},
// V
{r:'R91',s:'V',q:'Which action is <b>required</b> (not merely recommended) under V(A) when a firm relies on third-party research?',o:['Base analyst compensation on research quality.','Review the research\'s assumptions and evaluate its independence and objectivity.','Adopt written scenario-testing procedures for all models.'],a:1,e:'Reviewing assumptions and evaluating objectivity is <b>required</b>. A and C are recommended firm policies.',k:'제3자 리서치 검토 = 의무.'},
{r:'R91',s:'V',q:'Lee, a keen cyclist, rides a new bike and issues a “Buy” on its maker without reviewing its financial statements. Lee has <b>most likely</b> violated:',o:['V(A) Diligence and Reasonable Basis.','III(C) Suitability.','No Standard, since he tested the product.'],a:0,e:'A recommendation needs a <b>reasonable and adequate basis</b> supported by research and investigation.',k:'재무분석 없는 추천 → V(A).'},
{r:'R91',s:'V',q:'A report states, “EPS will grow 15% next year,” based on the analyst\'s model, without qualification. This <b>most likely</b> violates:',o:['V(B), because it does not distinguish opinion from fact.','I(C), because forecasts are prohibited.','No Standard, because the model is reasonable.'],a:0,e:'Expectations from statistical modeling are <b>not facts</b>; V(B) requires distinguishing fact from opinion.',k:'예측을 사실처럼 → V(B).'},
{r:'R91',s:'V',q:'An adviser switches from a fundamental to a quantitative stock-selection process. Under V(B), she must:',o:['disclose the change promptly to clients and prospects.','disclose it at the next annual review.','disclose it only if performance changes.'],a:0,e:'Members must <b>promptly disclose</b> changes that might materially affect the investment process.',k:'프로세스 변경 즉시 공시.'},
{r:'R91',s:'V',q:'With no regulatory requirement or firm policy in place, the Standards recommend keeping research records for at least:',o:['five years.','seven years.','ten years.'],a:1,e:'V(C) recommends a <b>seven-year</b> minimum holding period.',k:'최소 7년.'},
// VI
{r:'R91',s:'VI',q:'Flores, CFA, is writing a report on Delta Corp. Her husband sits on Delta\'s board, and she owns no shares. Under VI(A), she should:',o:['disclose nothing because she owns no shares.','disclose her husband\'s board position to her employer and in the report.','stop covering Delta in all cases.'],a:1,e:'Board service by a close relative could impair objectivity; <b>avoid or fully disclose</b> in a prominent, plain-language way.',k:'배우자 이사회 → 공시.'},
{r:'R91',s:'VI',q:'An analyst decides a stock should be sold. He advises clients holding it to sell, waits a day so they can act, then sells his own shares. This is:',o:['a violation of VI(B).','a violation of III(B).','consistent with VI(B).'],a:2,e:'Clients had an <b>adequate opportunity to act</b> before his personal trade.',k:'고객 기회 보장 후 개인 매도 = OK.'},
{r:'R91',s:'VI',q:'A portfolio manager buys a stock for her personal account the day before buying a large block for client accounts. This is <b>best</b> described as:',o:['permitted if her execution price is worse than the clients\'.','front-running, which violates VI(B).','permitted if the firm has no personal trading policy.'],a:1,e:'Trading ahead of anticipated client trades is <b>front-running</b>. A missing firm policy does not excuse it.',k:'선행매매 = 위반.'},
{r:'R91',s:'VI',q:'Reed, CFA, receives $500 for each client he refers to a tax adviser. To comply with VI(C), Reed must disclose:',o:['only that a referral arrangement exists, after the client signs up.','the arrangement and the amount of the fee, before the client engages the adviser.','nothing, if the tax adviser\'s fees are competitive.'],a:1,e:'Disclose the <b>nature and value</b> of the consideration so the client can judge cost and <b>partiality</b> — before the relationship begins.',k:'성격·금액을 사전에 공시.'},
// VII
{r:'R91',s:'VII',q:'After the exam, a Level II candidate posts: “I studied hard for currency arbitrage, and there were zero questions on it.” The candidate has:',o:['not violated the Standards; it is an opinion.','violated VII(A) by revealing exam content.','violated VII(B) by misrepresenting candidacy.'],a:1,e:'Revealing topics tested or not tested compromises exam integrity (VII(A)). Opinions about CFA Institute are allowed; exam content is not.',k:'미출제 주제 공개도 VII(A) 위반.'},
{r:'R91',s:'VII',q:'Which statement in a promotional brochure <b>complies</b> with VII(B)?',o:['“As a CFA charterholder, Ana will achieve superior returns.”','“Ana passed all three levels of the CFA exam on her first attempts.”','“Ana Gómez, C.F.A., Senior Analyst.”'],a:1,e:'Stating facts about passing is acceptable. A implies superior performance; C misuses the mark (CFA has no periods).',k:'사실 진술만 OK.'},
{r:'R91',s:'VII',q:'At the end of the exam the proctor says “pencils down.” Kumar quickly fills in one more answer. Kumar has <b>most likely</b>:',o:['not violated the Standards because it was one answer.','violated VII(A).','not violated the Standards because others kept writing.'],a:1,e:'Not following exam rules violates <b>VII(A)</b>, regardless of how many answers or what others did.',k:'시험 규정 위반 = VII(A).'},
// R92
{r:'R92',s:'GIPS',q:'Which entity can <b>least likely</b> claim compliance with GIPS?',o:['An asset management subsidiary held out to clients as a distinct business.','A software vendor whose products calculate GIPS returns.','The investment management division of a bank, held out as a separate firm.'],a:1,e:'Only firms that <b>manage assets for others</b> may claim compliance. Software developers may <b>endorse</b> GIPS but not claim compliance.',k:'소프트웨어 회사 = 준수 주장 불가.'},
{r:'R92',s:'GIPS',q:'A GIPS-compliant composite must include:',o:['all fee-paying, discretionary portfolios managed to that strategy, including terminated accounts.','only portfolios managed for the full reporting period.','both discretionary and nondiscretionary portfolios with the same strategy.'],a:0,e:'Composites include <b>all fee-paying discretionary portfolios (current and past)</b> managed to the same strategy; nondiscretionary accounts are excluded.',k:'모든 재량·수수료 포트폴리오 + 해지 계좌.'},
{r:'R92',s:'GIPS',q:'A firm puts all discretionary fee-paying accounts — value and growth strategies together — into a single composite. Does this meet GIPS?',o:['Yes.','No, because the strategies are not similar.','No, because nondiscretionary accounts are excluded.'],a:1,e:'A composite groups portfolios with a <b>similar</b> strategy, objective, or mandate. Mixing value and growth fails.',k:'가치·성장 혼합 → 불가.'},
{r:'R92',s:'GIPS',q:'Which statement about GIPS verification is <b>most accurate</b>?',o:['It may be performed on a single composite.','It is required to claim GIPS compliance.','It is performed by a third party on a firmwide basis.'],a:2,e:'Verification is <b>optional</b>, done by a <b>third party</b>, and applies to the <b>entire firm</b>.',k:'제3자·전사적, 선택 사항.'},
{r:'R92',s:'GIPS',q:'A client prohibits the manager from holding any technology stocks, preventing the growth strategy from being implemented. Under GIPS, the firm may:',o:['classify the account as nondiscretionary and exclude it from the composite.','include it in the composite with a footnote.','exclude it only if its returns are below the composite average.'],a:0,e:'If client restrictions prevent the intended strategy, the portfolio may be <b>nondiscretionary</b> and excluded, per the firm\'s criteria.',k:'제약으로 전략 불가 → 비재량 → 제외.'},
{r:'R92',s:'GIPS',q:'Composite returns under GIPS are calculated as:',o:['a simple average of portfolio returns.','an asset-weighted average of portfolio returns.','the return of the largest portfolio.'],a:1,e:'Section 3: composite returns are the <b>asset-weighted average</b> (not a simple average).',k:'자산가중평균.'},
// R93 integrated
{r:'R93',s:'Mixed',q:'A retired manager owns a small-cap stock he wants to sell. He posts online: “This stock is going up once patents are approved — buy below $3.” He has <b>most likely</b> violated the Standards related to:',o:['Integrity of Capital Markets only.','Conflicts of Interest only.','both Integrity of Capital Markets and Conflicts of Interest.'],a:2,e:'Hyping a stock to sell into the rise is <b>market manipulation</b> (II(B)), and failing to disclose his holding is an undisclosed <b>conflict</b> (VI(A)).',k:'II(B) + VI(A) 동시 위반.'},
{r:'R93',s:'Mixed',q:'Investment banking asks the head of research to change a “Hold” to “Buy” on a banking client. The head of research\'s <b>most appropriate</b> action is to:',o:['place the stock on a restricted list and publish only factual information.','assign a new analyst without mentioning the request.','tell the current analyst to reconsider a “Buy.”'],a:0,e:'Placing the issuer on a <b>restricted list</b> and limiting research to factual information protects <b>independence and objectivity</b> (I(B)).',k:'제한 종목 지정, 사실 정보만.'},
{r:'R93',s:'Mixed',q:'Kassim, a candidate, buys a stock for himself right before publishing a “Buy.” His firm has no personal trading policy, and Musa, CFA, head of compliance, has never adopted one. Who most likely violated the Standards?',o:['Only Kassim.','Only Musa.','Both Kassim and Musa.'],a:2,e:'Kassim front-ran his own recommendation (VI(B)). Musa, as a supervisor, failed to have adequate procedures (IV(C)).',k:'둘 다 위반: 선행매매 + 감독 책임.'},
{r:'R93',s:'Mixed',q:'A financial planner paid on product sales tells a couple to move $200,000 into the firm\'s fund despite a $40,000 surrender penalty, saying “the better returns will more than cover the penalty.” Her actions are:',o:['acceptable if the fund is suitable.','a violation, because she implies a guaranteed return.','acceptable because she disclosed the penalty.'],a:1,e:'Assuring that returns will cover the penalty implies a <b>guaranteed return</b> — I(C) Misrepresentation (and the sales-based pay is a conflict to disclose).',k:'수익 보장 암시 = I(C).'},
];

/* ---------- RENDER ---------- */
function renderQuiz(){
  return `<h2 class="rt">Practice · 예상문제</h2>
  <p class="rsub">시험 문제 형식(A/B/C 3지선다)으로 새로 만든 문제 ${Q.length}개 · 선택하면 바로 정답과 영·한 해설이 나옵니다</p>
  <div class="qbar">
    <div class="score" id="score"></div>
    <div class="filters" id="qf">${['All','R89','R90','R91','R92','R93','Wrong'].map((x,i)=>`<button class="fbtn" aria-pressed="${i===0}" data-qf="${x}">${x==='All'?'전체':x==='Wrong'?'틀린 문제':x}</button>`).join('')}</div>
    <button class="qbtn" id="qreset">Reset · 다시 풀기</button>
  </div>
  <div id="qlist"></div>
  <p class="note">문제는 Schweser 노트와 첨부하신 Test Bank의 출제 패턴을 참고해 새로 작성했습니다. 풀이 기록은 이 브라우저에만 저장됩니다.</p>`;
}
let ANS={};
try{ANS=JSON.parse(localStorage.getItem('eth-ans')||'{}')}catch(e){ANS={}}
const saveAns=()=>{try{localStorage.setItem('eth-ans',JSON.stringify(ANS))}catch(e){}};
let qfilter='All';
function drawQ(){
  const list=$('#qlist'); if(!list) return;
  const items=Q.map((q,i)=>({q,i})).filter(({q,i})=>qfilter==='All'||(qfilter==='Wrong'?(ANS[i]!==undefined&&ANS[i]!==q.a):q.r===qfilter));
  list.innerHTML=items.length?items.map(({q,i})=>{
    const a=ANS[i]; const done=a!==undefined; const g=q.s&&G[q.s]?q.s:null;
    return `<div class="q" id="q${i}">
     <div class="meta"><span class="tag">Q${i+1}</span><span class="tag">${q.r}</span>${q.s?`<span class="tag std" style="--c:${g?cvar(g):'var(--muted)'}">${g?'Standard '+q.s:q.s}</span>`:''}</div>
     <p class="stem">${q.q}</p>
     <div class="opts">${q.o.map((o,j)=>`<button class="opt ${done?(j===q.a?'right':(j===a?'wrong':'')):''}" data-q="${i}" data-o="${j}" ${done?'disabled':''}><span class="l">${'ABC'[j]}.</span><span>${o}</span></button>`).join('')}</div>
     ${done?`<div class="exp"><div class="verdict ${a===q.a?'ok':'ng'}">${a===q.a?'Correct · 정답':'Incorrect · 오답'} — Answer ${'ABC'[q.a]}</div><p class="en" style="margin:0 0 4px">${q.e}</p><p class="ko" style="margin:0">${q.k}</p></div>`:''}
    </div>`}).join(''):`<p class="note">${qfilter==='Wrong'?'아직 틀린 문제가 없습니다.':'문제가 없습니다.'}</p>`;
  const tried=Object.keys(ANS).length, right=Object.entries(ANS).filter(([i,v])=>Q[i]&&Q[i].a===v).length;
  $('#score').innerHTML=`<span class="ok">${right}</span> correct · <span class="ng">${tried-right}</span> wrong · ${Q.length-tried} left`;
}

const CONTENT={overview:()=>OVERVIEW,r89:()=>R89,r90:()=>R90,r91:R91,r92:()=>R92,r93:R93,sheet:()=>SHEET,quiz:renderQuiz};
const tabsEl=$('#tabs');
tabsEl.innerHTML=TABS.map(t=>`<button role="tab" id="t-${t[0]}" data-tab="${t[0]}" aria-selected="false">${t[1]}<small>${t[2]}</small></button>`).join('');
function show(id,scrollTo){
  if(!CONTENT[id]) id='overview';
  $('#main').innerHTML=`<section class="tab" role="tabpanel">${CONTENT[id]()}</section><footer>Based on Schweser Notes 2025, Readings 89–93 · Standards text from the Standards of Practice Handbook, 12th ed. Practice questions are original.</footer>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));
  try{localStorage.setItem('eth-tab',id)}catch(e){}
  if(id==='quiz') drawQ();
  if(scrollTo){const el=document.getElementById(scrollTo); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),30);} else window.scrollTo(0,0);
  $('#t-'+id).scrollIntoView({block:'nearest',inline:'nearest'});
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]'); if(b) show(b.dataset.tab)});
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-jump]'); if(m){show('r91','g-'+m.dataset.jump);return}
  const c=e.target.closest('.chip[data-g]'); if(c){document.getElementById('g-'+c.dataset.g).scrollIntoView({behavior:'smooth',block:'start'});return}
  const o=e.target.closest('.opt[data-q]'); if(o&&!o.disabled){ANS[+o.dataset.q]=+o.dataset.o; saveAns(); const y=window.scrollY; drawQ(); window.scrollTo(0,y); return}
  const f=e.target.closest('[data-qf]'); if(f){qfilter=f.dataset.qf; document.querySelectorAll('[data-qf]').forEach(b=>b.setAttribute('aria-pressed',b===f)); drawQ(); return}
  if(e.target.closest('#qreset')){ANS={}; saveAns(); drawQ(); return}
  const cg=e.target.closest('[data-cg]'); if(cg){const g=cg.dataset.cg; document.querySelectorAll('[data-cg]').forEach(b=>b.setAttribute('aria-pressed',b===cg)); document.querySelectorAll('#casetbl tbody tr').forEach(r=>r.hidden=!(g==='All'||r.dataset.g===g)); return}
});
let start='overview';
const h=(location.hash||'').slice(1);
if(CONTENT[h]) start=h; else {try{const s=localStorage.getItem('eth-tab'); if(s&&CONTENT[s]) start=s}catch(e){}}
show(start);
</script>

</body></html>
